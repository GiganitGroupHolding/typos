[package]
name = "typos"
version = "0.1.0"
description = "TYPOS — учебные конспекты"
edition = "2024"
rust-version = "1.90"

[lib]
name = "typos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3" }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.12.4" }
tauri-plugin-dialog = "2"
percent-encoding = "2"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
