[package]
name = "typos"
version = "0.1.0"
description = "TYPOS — учебные конспекты"
edition = "2024"
rust-version = "1.90"

[lib]
name = "typos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.12.4", features = [] }
tauri-plugin-dialog = "2.8.3"
percent-encoding = "2.3.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
