# TYPOS на своём сервере: сервер хранения, MCP и сайт за Caddy. Инструкция — docs/self-hosting.md.
# Настройки — deploy/.env (образец .env.example), секреты MCP — ${TYPOS_DATA}/mcp.env, данные — в ${TYPOS_DATA}.
name: typos

services:
  storage:
    build: { context: .., dockerfile: Dockerfile.storage }
    # --trust-proxy верен, только пока порт сервера не опубликован: снаружи к нему ходит лишь Caddy
    command:
      - node
      - server/container.mjs
      - --trust-proxy
      - --public-url
      - ${VAULT_URL:?задай VAULT_URL в deploy/.env}
      - --name
      - ${VAULT_NAME:-TYPOS}
    volumes: ['${TYPOS_DATA:?задай TYPOS_DATA в deploy/.env}/storage:/data']
    restart: unless-stopped

  mcp:
    # запускается только с --profile mcp
    profiles: [mcp]
    build: { context: .., dockerfile: Dockerfile.mcp }
    env_file: ${TYPOS_DATA}/mcp.env
    environment:
      MCP_AUTH_MODE: owner
      MCP_PUBLIC_URL: ${MCP_URL:?задай MCP_URL в deploy/.env}/mcp
      MCP_AUTH_DATA_DIR: /data/auth
      MCP_TRUST_PROXY: '1'
    volumes: ['${TYPOS_DATA}/mcp:/data']
    depends_on: [storage]
    restart: unless-stopped

  caddy:
    image: caddy:2
    # папка deploy целиком, а не один файл: после git pull Caddy видит новый Caddyfile
    command: caddy run --config /etc/typos/${CADDYFILE:-Caddyfile} --adapter caddyfile
    ports: ['80:80', '443:443', '443:443/udp', '8443:8443', '9443:9443']
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-}
      VAULT_DOMAIN: ${VAULT_DOMAIN:-}
      MCP_DOMAIN: ${MCP_DOMAIN:-}
      LAN_IP: ${LAN_IP:-}
    volumes:
      - ./:/etc/typos:ro
      - ../dist:/srv/app:ro
      # здесь сертификаты и локальный центр сертификации: не удаляй (docker compose down -v)
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
